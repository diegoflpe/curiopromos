<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ofertas para Afiliados</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #00e676;
            --accent-whatsapp: #25D366;
            --accent-blue: #29b6f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }

        .container { width: 100%; max-width: 600px; background-color: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; background-color: var(--input-bg); border: 1px solid #333; border-radius: 8px; color: var(--text-primary); font-size: 1rem; outline: none; transition: border 0.3s; }
        input:focus, textarea:focus { border-color: var(--accent-green); }

        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }

        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        .btn-generate { background-color: var(--accent-green); color: #000; }

        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-copy { background-color: var(--input-bg); color: var(--text-primary); border: 1px solid #444; flex: 1; }
        .btn-whatsapp { background-color: var(--accent-whatsapp); color: #fff; flex: 2; }
        .btn-new { background-color: var(--accent-blue); color: #fff; flex: 1; }
        button:hover { opacity: 0.9; }

        .result-area { margin-top: 25px; display: none; }
        .result-box { background-color: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; white-space: pre-wrap; font-family: monospace; font-size: 0.95rem; line-height: 1.5; color: #ddd; margin-bottom: 15px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Ofertas ML</h1>

    <div class="input-group">
        <label>🔗 Link de Afiliado</label>
        <input type="url" id="link" placeholder="https://mercadolivre.com/sec/..." required>
    </div>

    <div class="input-group">
        <label>Aa Título do Produto</label>
        <input type="text" id="titulo" placeholder="Ex: Echo Dot (5ª geração)..." required>
    </div>

    <div class="input-group">
        <label>💬 Comentário Pessoal (Vai na 1ª linha)</label>
        <textarea id="comentario" rows="2" placeholder="Ex: ACHADINHO DO DIA! Corre que é por tempo limitado..."></textarea>
    </div>

    <div class="row">
        <div class="input-group">
            <label>Preço Atual (R$)</label>
            <input type="number" id="precoAtual" placeholder="299.00" step="0.01" required>
        </div>
        <div class="input-group">
            <label>Preço Antigo (R$)</label>
            <input type="number" id="precoAntigo" placeholder="499.00" step="0.01">
        </div>
    </div>

    <div class="row">
        <div class="input-group">
            <label>Cupom (Opcional)</label>
            <input type="text" id="cupom" placeholder="Ex: PROMO10">
        </div>
        <div class="input-group">
            <label>Preço c/ Cupom (Opcional)</label>
            <input type="number" id="precoCupom" placeholder="99.99" step="0.01">
        </div>
    </div>

    <button class="btn-generate" onclick="gerarAnuncio()">Gerar Anúncio ✨</button>

    <div class="result-area" id="resultArea">
        <label>Prévia do Anúncio:</label>
        <div class="result-box" id="resultBox"></div>
        
        <div class="action-buttons">
            <button class="btn-copy" id="btnCopy" onclick="copiarTexto()">Copiar 📋</button>
            <button class="btn-whatsapp" id="btnWhatsapp" onclick="enviarWhatsApp()">
                WhatsApp 
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 2C6.505 2 2 6.478 2 11.979c0 1.76.458 3.454 1.32 4.955L2 22l5.226-1.357a9.93 9.93 0 004.805 1.236h.004c5.523 0 10.027-4.478 10.027-9.979C22.062 6.478 17.558 2 12.031 2zm5.835 14.195c-.244.686-1.42 1.32-1.96 1.378-.54.058-1.054.267-3.556-.84-2.502-1.107-4.058-3.686-4.182-3.855-.124-.17-.99-1.32-.99-2.518 0-1.198.63-1.788.85-2.032.222-.244.48-.305.642-.305.16 0 .32.003.46.01.144.006.338-.055.527.402.19.456.65 1.59.708 1.708.058.118.096.256.018.41-.08.156-.156.252-.31.43-.15.18-.32.4-.458.528-.15.14-.3.294-.13.59.17.29.75 1.24 1.61 2.007.11.098.21.18.317.257.96.698 1.328.79 1.57.884.244.094.386.084.53-.056.14-.14.618-.72.783-.966.164-.244.328-.204.55-.12.224.084 1.41.666 1.65.786.24.12.4.18.46.28.06.1.06.586-.184 1.272z"/></svg>
            </button>
            <button class="btn-new" onclick="limparTudo()">Novo 🔄</button>
        </div>
    </div>
</div>

<script>
    let textoGerado = "";

    function gerarAnuncio() {
        const link = document.getElementById('link').value.trim();
        const titulo = document.getElementById('titulo').value.trim();
        const precoAtual = parseFloat(document.getElementById('precoAtual').value);
        const precoAntigo = parseFloat(document.getElementById('precoAntigo').value);
        const cupom = document.getElementById('cupom').value.trim().toUpperCase();
        const precoCupom = parseFloat(document.getElementById('precoCupom').value);
        const comentario = document.getElementById('comentario').value.trim();

        if (!link || !titulo || isNaN(precoAtual)) {
            alert("Por favor, preencha o Link, Título e Preço Atual.");
            return;
        }

        const formatarMoeda = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        textoGerado = "";

        // Comentário pessoal na primeira linha (sem emoji)
        if (comentario) {
            textoGerado += `${comentario}\n\n`;
        }
        
        // Título do produto com emoji de pássaro 🐦
        textoGerado += `🐦 ${titulo}\n\n`;
        if (!isNaN(precoAntigo) && precoAntigo > 0) textoGerado += `❌ De: ${formatarMoeda(precoAntigo)}\n`;
        textoGerado += `✅ Por: ${formatarMoeda(precoAtual)}\n`;
        if (cupom) {
            textoGerado += `🎟️ Cupom: ${cupom}\n`;
            if (!isNaN(precoCupom) && precoCupom > 0) textoGerado += `💥 Preço final com cupom: ${formatarMoeda(precoCupom)}\n`;
        }
        
        textoGerado += `\n👉 ${link}`;

        document.getElementById('resultBox').textContent = textoGerado;
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
    }

    function limparTudo() {
        // Limpa todos os campos
        document.getElementById('link').value = '';
        document.getElementById('titulo').value = '';
        document.getElementById('comentario').value = '';
        document.getElementById('precoAtual').value = '';
        document.getElementById('precoAntigo').value = '';
        document.getElementById('cupom').value = '';
        document.getElementById('precoCupom').value = '';
        
        // Limpa o resultado
        textoGerado = "";
        document.getElementById('resultBox').textContent = '';
        document.getElementById('resultArea').style.display = 'none';
        
        // Foca no primeiro campo (link)
        document.getElementById('link').focus();
        
        // Scroll para o topo
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copiarTexto() {
        if(!textoGerado) return;
        navigator.clipboard.writeText(textoGerado).then(() => {
            const btn = document.getElementById('btnCopy');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "Copiado! ✅";
            btn.style.backgroundColor = "var(--accent-green)";
            btn.style.color = "#000";
            setTimeout(() => {
                btn.innerHTML = textoOriginal;
                btn.style.backgroundColor = "var(--input-bg)";
                btn.style.color = "var(--text-primary)";
                limparTudo();
            }, 1500);
        });
    }

    function enviarWhatsApp() {
        if (!textoGerado) {
            alert("Gere o anúncio primeiro!");
            return;
        }

        const textoCodificado = encodeURIComponent(textoGerado);
        const urlWhatsApp = `https://api.whatsapp.com/send?text=${textoCodificado}`;
        window.open(urlWhatsApp, '_blank');
        
        setTimeout(() => {
            limparTudo();
        }, 500);
    }
</script>

</body>
</html>
